<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MapboxGL LegendControl example</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.0.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.0.0/mapbox-gl.css" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        padding: 0;
      }

      #map {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
      }

      .ethnicity-legend {
        border-left: 3px solid #aa9761;
        padding: 0.1px !important;
      }
    </style>
  </head>

  <body>
    <div id="map"></div>
    <script type="module" lang="ts">
      import { Map } from 'mapbox-gl';
      import LegendControl from './src';

      const map = new Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/light-v10',
        zoom: 12,
        center: [-122.447303, 37.753574],
        accessToken: import.meta.env.VITE_MAPBOX_TOKEN,
      });

      const legend = new LegendControl({
        collapsed: false,
        toggler: true,
        highlight: true,
        // layers: ['facilities', 'life-expectancy'],
        layers: {
          'life-expectancy': true,
          facilities: {
            toggler: false,
            collapsed: true,
          },
          ethnicity: { highlight: false },
          patterns: true,
          'muni-routes': true,
          'fire-events': {
            collapsed: true,
            onToggle: () => console.log('This is special'),
            unit: v => (v === 1 ? ' person' : ' people'),
            properties: {
              'circle-color': { unit: v => (v === 1 ? ' alarm' : ' alarms') },
            },
          },
        },
        onToggle: layer => console.log(`${layer} toggled`),
      });

      map.addControl(legend, 'bottom-left');

      setTimeout(() => {
        legend.removeLayers(['muni-routes']);
        setTimeout(() => legend.addLayers(['muni-routes']), 5000);
      }, 5000);

      map.on('load', () => {
        map.addSource('ethnicity', {
          type: 'vector',
          url: 'mapbox://examples.8fgz4egr',
        });

        map.addSource('neighborhoods', {
          type: 'geojson',
          data: './assets/neighborhoods.geojson',
        });

        map.addSource('fireevents', {
          type: 'geojson',
          data: './assets/fire-events.geojson',
        });

        map.addSource('facilities', {
          type: 'geojson',
          data: './assets/facilities.geojson',
        });

        map.addLayer({
          id: 'ethnicity',
          type: 'circle',
          source: 'ethnicity',
          'source-layer': 'sf2010',
          minzoom: 10,
          maxzoom: 16,
          paint: {
            'circle-color': [
              'match',
              ['get', 'ethnicity'],
              'White', '#f1e8c8',
              'Black', '#443722',
              'Hispanic', '#aa9761',
              'Asian', '#e8e59d',
              '#ccc',
            ],
          },
          metadata: {
            legend: {
              classes: ['ethnicity-legend'],
            },
          },
        });

        map.addLayer({
          id: 'fire-events',
          type: 'circle',
          source: 'fireevents',
          paint: {
            'circle-color': [
              'step',
              ['to-number', ['get', 'number_of_alarms']],
              '#ccc',
              1, '#d3f2a3',
              2, '#4c9b82',
              3, '#074050',
            ],
            'circle-opacity': 0.5,
            'circle-radius': [
              'interpolate',
              ['linear'],
              ['to-number', ['get', 'suppression_personnel']],
              1, 5,
              10, 15,
              25, 25,
              50, 35,
            ],
          },
          metadata: {
            legend: {
              name: 'Fire events',
            },
          },
        });

        const lifeExpectancy = [
          ['Tenderloin', 72.2],
          ['SoMa', 73.5],
          ['Rincon Hill', 81.6],
          ['South Beach', 82.5],
          ['Chinatown', 83.2],
          ['Nob Hill', 81.1],
          ['Mission', 82.8],
          ['Ingleside', 81.8],
          ['Taraval', 82.8],
          ['Castro', 83.1],
          ['Lower Pacific Heights', 82.7],
          ['Panhandle', 82.8],
          ['Financial District', 86],
          ['Inner Richmond', 83.9],
          ['Outer Richmond', 84.1],
          ['Sunset', 83.9],
          ['Marina', 84.3],
          ['Bayview', 77.4],
          ['Portola', 84.7],
          ['Twin Peaks', 84.5],
          ['Lake Merced', 83.5],
          ['North Beach', 83.5],
          ['Bayshore', 81.9],
        ].flatMap(([name, exp]) => [['==', ['get', 'neighborhood'], name], exp]);

        map.addLayer({
          id: 'life-expectancy',
          type: 'fill',
          source: 'neighborhoods',
          paint: {
            'fill-color': [
              'case',
              ['!=', ['get', 'neighborhood'], 'Tenderloin'],
              [
                'interpolate',
                ['linear'],
                ['case', ...lifeExpectancy, 0],
                70, '#a16928',
                80, '#edeac2',
                90, '#2887a1',
              ],
              '#cc3322',
            ],
            'fill-opacity': 0.4,
          },
          metadata: {
            legend: {
              name: 'Life expectancy',
              unit: 'y',
              labels: {
                '#cc3322': 'Excluded',
              },
            },
          },
        });

        map.addLayer({
          id: 'facilities',
          source: 'facilities',
          type: 'symbol',
          layout: {
            'icon-image': [
              'match',
              ['get', 'department_name'],
              'Recreation And Parks', 'park-15',
              'Public Health', 'hospital-15',
              'School District (Sfusd)', 'school-15',
              'Public Library', 'library-15',
              'Fire Department', 'fire-station-15',
              'Police Department', 'police-15',
              'Airport (Sfo)', 'airport-15',
              'Municipal Transportation Agency', 'bus',
              'Port', 'ferry',
              'marker-11',
            ],
          },
          metadata: {
            legend: {
              name: 'Facilities',
              labels: {
                'Recreation And Parks': 'Park & Recreation',
                'School District (Sfusd)': 'School',
                'Police Department': 'Police Station',
                'Airport (Sfo)': 'Airport',
                'Municipal Transportation Agency': 'Transportation',
              },
            },
          },
        });

        map.addSource('muni-routes', {
          type: 'geojson',
          data: './assets/muni-routes.geojson',
        });

        map.addLayer({
          id: 'muni-routes',
          type: 'line',
          source: 'muni-routes',
          // layout: {
          //   'line-cap': 'round',
          //   'line-join': 'round',
          // },
          paint: {
            'line-color': [
              'match',
              ['get', 'route_name'],
              '1', '#3288bd',
              '14', '#d53e4f',
              'N', '#66c2a5',
              'T', '#f46d43',
              'M', '#fdae61',
              'L', '#fee08b',
              'K', '#e6f598',
              'J', '#abdda4',
              '#aaa',
            ],
            'line-width': [
              'interpolate',
              ['linear'],
              ['get', 'passengers_avg'],
              1000, 1,
              5000,3,
              15000, 6,
              30000, 10,
            ],
            // 'line-dasharray': [2, 1],
          },
          metadata: {
            legend: {
              properties: {
                'line-width': { unit: ' pax/h' },
              },
            },
          },
        });

        map.loadImage('./assets/pattern.stripe.png', (error, image) => {
          if (error) throw error;
          map.addImage('stripes', image);
          map.addLayer(
            {
              id: 'patterns',
              type: 'fill',
              source: 'neighborhoods',
              paint: {
                'fill-pattern': 'stripes',
              },
            },
            'ethnicity',
          );
        });
      });
    </script>
  </body>
</html>
